name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Test rapide du coeur DSP : aucune dependance, quelques secondes.
  # ---------------------------------------------------------------------------
  dsp-tests:
    name: Tests DSP (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler et lancer le banc de test
        run: |
          g++ -O2 -std=c++17 -o dsp_test tests/dsp_test.cpp
          ./dsp_test

  # ---------------------------------------------------------------------------
  # Build macOS universel + fabrication de l'installeur .pkg
  # ---------------------------------------------------------------------------
  macos-installer:
    name: Installeur macOS (.pkg)
    needs: dsp-tests
    runs-on: macos-14        # Apple Silicon, Xcode preinstalle
    permissions:
      contents: write        # necessaire pour publier la Release
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-${{ runner.os }}

      - name: Determiner la version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # --- Signature optionnelle : activee seulement si les secrets existent ---
      # Le contexte `secrets` n'est pas utilisable dans un `if:` -> on passe par env.
      - name: Detecter la presence d'un certificat
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [ -n "$CERT_P12" ]; then echo "enabled=true"  >> "$GITHUB_OUTPUT"
          else                        echo "enabled=false" >> "$GITHUB_OUTPUT"
                                      echo "::notice::Aucun certificat Developer ID — installeur non signe."
          fi

      - name: Importer les certificats Developer ID
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_P12:  ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASS: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k runner build.keychain
          rm -f /tmp/cert.p12

      - name: Construire l'installeur
        env:
          VERSION:   ${{ steps.ver.outputs.version }}
          APP_CERT:  ${{ secrets.MACOS_APP_CERT_NAME }}
          INST_CERT: ${{ secrets.MACOS_INSTALLER_CERT_NAME }}
        run: |
          chmod +x packaging/build_installer.sh packaging/scripts/postinstall
          ./packaging/build_installer.sh

      - name: Archiver les plugins bruts
        run: |
          cd build/CAPSTONE_artefacts/Release
          zip -qry "$GITHUB_WORKSPACE/dist/CAPSTONE-macOS-bundles.zip" AU VST3 Standalone

      - name: Publier les artefacts de build
        uses: actions/upload-artifact@v4
        with:
          name: CAPSTONE-macOS
          path: dist/*
          retention-days: 30

      - name: Creer la Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CAPSTONE-*.pkg
            dist/CAPSTONE-macOS-bundles.zip
          generate_release_notes: true
          body: |
            ## CAPSTONE ${{ steps.ver.outputs.version }}

            Installeur macOS universel (Apple Silicon + Intel), macOS 10.13 minimum.

            **Installation** : telecharger le `.pkg`, double-cliquer, choisir les
            formats souhaites (Audio Unit pour Logic Pro, VST3, application autonome).

            > Si le `.pkg` n'est pas signe Developer ID, macOS le bloquera au premier
            > lancement. Clic droit sur le fichier -> *Ouvrir*, puis confirmer.
