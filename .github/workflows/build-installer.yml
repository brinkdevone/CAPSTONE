name: CAPSTONE - Build macOS Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  dsp-tests:
    name: DSP tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CAPSTONE
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run DSP test suite
        run: |
          g++ -O2 -std=c++17 -o dsp_test tests/dsp_test.cpp
          ./dsp_test

  macos-installer:
    name: Build universal macOS PKG
    needs: dsp-tests
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Determine version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF#refs/tags/v}"; else VERSION="1.0.0-build.${GITHUB_SHA::7}"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Detect signing credentials
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [[ -n "$CERT_P12" ]]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASS: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p runner build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p runner build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASS" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k runner build.keychain
          rm -f /tmp/cert.p12
      - name: Build installer
        working-directory: CAPSTONE
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APP_CERT: ${{ secrets.MACOS_APP_CERT_NAME }}
          INST_CERT: ${{ secrets.MACOS_INSTALLER_CERT_NAME }}
        run: |
          chmod +x packaging/build_installer.sh packaging/scripts/postinstall
          ./packaging/build_installer.sh
      - name: Collect plugin bundles
        working-directory: CAPSTONE
        run: |
          mkdir -p dist
          cd build/CAPSTONE_artefacts/Release
          zip -qry "$GITHUB_WORKSPACE/CAPSTONE/dist/CAPSTONE-macOS-bundles.zip" AU VST3 Standalone
      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CAPSTONE-macOS-${{ steps.version.outputs.version }}
          path: CAPSTONE/dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CAPSTONE ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            CAPSTONE/dist/CAPSTONE-${{ steps.version.outputs.version }}.pkg
            CAPSTONE/dist/CAPSTONE-macOS-bundles.zip
          generate_release_notes: true
          body: |
            Universal macOS installer for CAPSTONE.
            Includes Audio Unit, VST3 and Standalone.
            This build is unsigned unless Developer ID secrets are configured.
